[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanogpt"
version = "1.0.0"
description = "Character-level transformer from scratch on numpy, with verified gradients"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.22"]

[project.scripts]
nanogpt = "nanogpt:main"

[tool.setuptools]
py-modules = ["nanogpt"]
